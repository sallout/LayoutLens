[project]
name = "layoutlens"
version = "0.1.0"
description = "Structured visual metadata (geometry + OCR) from UI screenshots, and experiments on whether it helps models reproduce interfaces."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
]

[project.optional-dependencies]
bench = [
  "playwright>=1.45",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8",
]

[project.scripts]
layoutlens = "layoutlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["layoutlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E731"]
